<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Restaurant Locator - by Algolia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./assets/favicon.ico" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/instantsearch.css@8.23.0/themes/satellite-min.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <!-- INTERFACE -->
    <div class="page">
      <div class="page__container">
        <div id="search-bar" class="search-bar">
          <div id="platform_name">  
            <h1>OpenTable Search Experience</h1>
          </div>
          <div class="search-bar__container">
            <div id="searchbox"></div>
          </div>
          <div id="geolocation-info">
            <p id="geolocation-status">Detecting your location…</p>
            <button id="geolocation-button" type="button">Use my exact location 📍</button>
          </div>
        </div>
        <div id="selected_container">
          <div id="current-refinements"></div>
          <div id="clear-refinements"></div>
          <div class="sort-control">
            <span class="sort-control__label" aria-hidden="true">Sort by</span>
            <select id="sort-by" class="ais-SortBy-select" aria-label="Sort by">
              <option value="popularity" selected>Popularity</option>
              <option value="distance">Distance</option>
            </select>
          </div>
        </div>
        <div id="left__container">
          <div id="cuisines__container">
            <h2 class="filter__title">Popular Cuisines</h2>
            <div id="refinement-list"></div>
          </div>
          <div id="pricing__container">
            <h2 class="filter__title">Price</h2>
            <div id="pricing-menu"></div>
          </div>
          <div id="rating__container">
            <h2 class="filter__title">Rating</h2>
            <div id="rating-menu"></div>
          </div>
          <div id="dining-style__container">
            <h2 class="dining-style-title">Dining Style</h2>
            <div id="dining-style"></div>
          </div>
        </div>
        <div id="hits__container">
          <div id="hits" class="results"></div>
        </div>
      </div>
    </div>
    <!-- /INTERFACE -->

    <!-- TEMPLATES -->
    <script type="text/html" id="result-template">
      <div class="results__item">
      	<div class="result">
      		<div class="result__image-container">
            <img class="result__image" src="{{image_url}}" alt="{{name}}" />
      		</div>
      		<div class="result__text-container">
            <!-- For highlighted text, using the older Mustache method in order to keep the template approach of the starting project. This doesn't work with InstantSearch v5 -->
      			<h2 class="result__title">{{#helpers.highlight}}{ "attribute": "name" }{{/helpers.highlight}}</h2>
                <div class="result__meta-row">
                  <p class="result__rating">
                    <span>{{ratingStars}}</span>
                    <span class="result__reviews"> · ({{reviews_count}} reviews)</span>
                  </p>
                  <!-- Distance information, if available -->
                  {{#hasDistance}}<p class="result__distance">{{distanceKm}} km away</p>{{/hasDistance}}
                </div>
      			<p class="result__summary">
              {{priceSymbols}} |
              {{#helpers.highlight}}{ "attribute": "food_type" }{{/helpers.highlight}} |
              {{#helpers.highlight}}{ "attribute": "neighborhood" }{{/helpers.highlight}}
              {{#showCity}} · {{#helpers.highlight}}{ "attribute": "city" }{{/helpers.highlight}}{{/showCity}}
            </p>
      		</div>
      	</div>
      </div>
    </script>

    <script type="text/html" id="no-results-template">
      <div id="no-results-message">
      	<p>We might have some trouble finding something with this criteria.😢</p>
      	<p>Try searching for something else!😉</p>
      	<a href="." class='clear-all'>Clear search</a>
      </div>
    </script>
    <!-- /TEMPLATES -->

    <!-- SCRIPTS -->
    <script type="module" src="./index.js"></script>
    <!-- /SCRIPTS -->
  </body>
</html>
